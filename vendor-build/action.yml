name: 'Vendor build'
description: 'Backwards-compatible alias for the install action. Use lepusinc/gha-composer/install instead.'

inputs:
  working-directory:
    description: 'Directory containing composer.json'
    required: false
    default: '.'

outputs:
  vendor-key:
    description: 'The vendor cache key used to save vendor/. Pass this to vendor-load so the keys align.'
    value: ${{ steps.install.outputs.vendor-key }}
  composer-key:
    description: 'The Composer downloads cache key.'
    value: ${{ steps.install.outputs.composer-key }}

runs:
  using: 'composite'
  steps:
    - uses: ./install
      id: install
      with:
        working-directory: ${{ inputs.working-directory }}
