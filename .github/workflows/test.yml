name: Test actions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 'Build (PHP ${{ matrix.php }})'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - uses: ./vendor-build
        with:
          working-directory: tests/fixture
      - name: Assert vendor installed
        run: test -f tests/fixture/vendor/autoload.php

  load:
    name: 'Load (PHP ${{ matrix.php }})'
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      # No setup-php here: vendor-load only restores a cache and needs no PHP/Composer.
      - name: Compute vendor cache key
        id: key
        working-directory: tests/fixture
        run: |
          vendor_hash=$( (sha256sum composer.lock; sha256sum composer.json) | sha256sum | awk '{print $1}')
          echo "vendor-key=${RUNNER_OS}-vendor-${vendor_hash}" >> "$GITHUB_OUTPUT"
      - uses: ./vendor-load
        with:
          path: tests/fixture/vendor
          key: ${{ steps.key.outputs.vendor-key }}
          fail-on-cache-miss: true
      - name: Assert vendor restored
        run: test -f tests/fixture/vendor/autoload.php
