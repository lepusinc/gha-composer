name: Update major tag

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to simulate (e.g. v1.1.0)'
        default: 'v0.1.2-test'

permissions:
  contents: write

jobs:
  update-major-tag:
    uses: lepusinc/.github/.github/workflows/update-major-tag.yml@v1
    with:
      tag_name: ${{ inputs.tag_name }}
